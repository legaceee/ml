[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-attack-ml"
version = "1.0.0"
description = "Cyber Attack Detection Using Optimized Machine Learning Models and Ensemble Methods"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ML Capstone Research Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "optuna>=3.5.0",
    "shap>=0.45.0",
    "imbalanced-learn>=0.12.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

